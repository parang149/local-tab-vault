name: Release
# v로 시작하는 태그를 올리면 테스트·빌드 후 확장 zip을 릴리스로 게시한다.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm --prefix ui ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          ver=$(node -p "require('./extension/manifest.json').version")
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "태그($GITHUB_REF_NAME)와 manifest 버전($ver)이 다릅니다"; exit 1; }
          (cd "dist/local-tab-vault-$ver" && zip -qr "../../local-tab-vault-$ver.zip" .)
          sha256sum "local-tab-vault-$ver.zip" > "local-tab-vault-$ver.zip.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "local-tab-vault-$ver.zip" "local-tab-vault-$ver.zip.sha256" \
            --title "로컬 탭 보관함 $ver" --notes-file .github/release-notes.md
